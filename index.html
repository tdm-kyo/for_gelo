<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Memoria di Gelo</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: #888888;
      font-style: italic;
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    .subtitle .sus {
      color: #ff5555;
      font-style: normal;
      font-weight: bold;
    }

    .bio {
      background-color: #1e1e1e;
      padding: 1rem;
      border-radius: 8px;
      line-height: 1.5;
      margin-bottom: 2rem;
      text-align: left;
    }

    .gallery {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .photo-frame {
      flex: 1;
      aspect-ratio: 3 / 4; /* Formato verticale */
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Smegmasum</h1>
    <p class="subtitle">Dedicated to my friend Gelo who is not among us anymore </p>

    <div class="bio">
      Gelo was born in a strange place with hairy oily black men, but this did not stop him to become the first asian lesbian to become president of Ottaviano.
    </div>

    <div class="gallery">
      <div class="photo-frame">
        <img src="gelo1.jpeg" alt="Gelo 1" onerror="this.style.display='none'">
      </div>
      <div class="photo-frame">
        <img src="gelo2.jpeg" alt="Gelo 2" onerror="this.style.display='none'">
      </div>
    </div>
  </div>

</body>
</html>
